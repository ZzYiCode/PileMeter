[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pile-meter-backend"
version = "0.1.0"
description = "PileMeter multi-view stockpile reconstruction and measurement backend"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]
reconstruction = [
  "einops>=0.8,<1",
  "huggingface-hub>=0.26,<3",
  "numpy>=1.26,<3",
  "pillow>=10,<13",
  "safetensors>=0.4,<1",
  "torch>=2.4",
]
dev = [
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "pillow>=10,<13",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
pile-meter = "pile_meter.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
